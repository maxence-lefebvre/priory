# The Slack app for Priory's "Queue in Priory" message shortcut. Each person creates their own app
# from this manifest at https://api.slack.com/apps. See slack.md#message-shortcut.
display_information:
  name: Priory
  description: Queue a Slack thread as a Priory task.
features:
  bot_user:
    display_name: Priory
    always_online: false
  shortcuts:
    - name: Queue in Priory
      type: message
      callback_id: priory_queue
      description: Queue this thread as a Priory task.
oauth_config:
  scopes:
    bot:
      - commands
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
