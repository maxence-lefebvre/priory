<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 760" width="680" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Two runners sharing one log</title>
  <desc id="desc">A sequence between runner a, the log and runner b, in four parts from top to bottom. Claiming a task: a task request lands, both runners read it and each claims the key, and the first claim in the log wins, so runner a owns the task. Holding it: runner a publishes an alive message once a minute, the hold waiting while no run started, and the hold kept before the first run, which starts once runner a reads kept back from the log. Runner a is cut off: its kept tasks go on and its waiting tasks stay unstarted, its lease ends 30 minutes after its last alive message, then runner b claims its waiting tasks, takes them over and runs them, while kept tasks stay with runner a. Runner a is back: it reads the log before any run and drops each task that moved to runner b.</desc>
  <style>
    svg { --surface: #FFFFFF; --raised: #F1F1F1; --line: #E7E7E7; --edge: #878787; --text: #161616; --text-2: #4A4A4A; --text-3: #6E6E6E; --action: #161616; --action-soft: #F1F1F1; --wait: #A84D06; --danger: #C0262D; }
    @media (prefers-color-scheme: dark) {
      svg { --surface: #141414; --raised: #1D1D1D; --line: #262626; --edge: #6B6B6B; --text: #EDEDED; --text-2: #B5B5B5; --text-3: #8A8A8A; --action: #EDEDED; --action-soft: #1D1D1D; --wait: #F0A04B; --danger: #F2777A; }
    }
    text { font: 12px "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text-2); }
    .t { font-weight: 600; font-size: 14px; fill: var(--text); }
    .cap { font-weight: 600; font-size: 13px; fill: var(--text); paint-order: stroke; stroke: var(--surface); stroke-width: 6px; }
    .mid { text-anchor: middle; }
    .bg { fill: var(--surface); stroke: var(--line); }
    .box { fill: var(--surface); stroke: var(--edge); stroke-width: 1.5; }
    .shared { fill: var(--action-soft); stroke: var(--edge); stroke-width: 1.5; }
    .note { fill: var(--raised); }
    .rule { stroke: var(--edge); stroke-width: 1; }
    .life { stroke: var(--edge); stroke-dasharray: 2 5; }
    .flow { fill: none; stroke: var(--text-2); stroke-width: 1.5; }
    .cut { fill: none; stroke: var(--danger); stroke-width: 2; stroke-linecap: round; }
    #tip { fill: var(--text-2); }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="679" height="759" rx="12"/>

  <path class="life" d="M100,64 V744 M340,64 V744 M580,64 V744"/>
  <rect class="box" x="12" y="20" width="176" height="44" rx="8"/>
  <text class="t mid" x="100" y="47">Runner a</text>
  <rect class="shared" x="252" y="20" width="176" height="44" rx="8"/>
  <text class="t mid" x="340" y="47">The log</text>
  <rect class="box" x="492" y="20" width="176" height="44" rx="8"/>
  <text class="t mid" x="580" y="47">Runner b</text>

  <text class="cap" x="20" y="88">Claiming a task</text>
  <path class="rule" d="M20,95 H660"/>
  <rect class="note" x="240" y="106" width="200" height="44" rx="8"/>
  <text class="mid" x="340" y="124">A task request lands.</text>
  <text class="mid" x="340" y="140">Both runners read it.</text>
  <text class="mid" x="220" y="170">claims the key</text>
  <path class="flow" marker-end="url(#tip)" d="M100,178 H339"/>
  <text class="mid" x="460" y="170">claims the key</text>
  <path class="flow" marker-end="url(#tip)" d="M580,178 H341"/>
  <rect class="note" x="240" y="192" width="200" height="44" rx="8"/>
  <text class="mid" x="340" y="210">The first claim in the log</text>
  <text class="mid" x="340" y="226">wins: runner a owns the task.</text>

  <text class="cap" x="20" y="262">Holding it</text>
  <path class="rule" d="M20,269 H660"/>
  <text class="mid" x="220" y="292">alive, once a minute</text>
  <path class="flow" marker-end="url(#tip)" d="M100,300 H339"/>
  <text class="mid" x="220" y="324">hold: waiting, no run started yet</text>
  <path class="flow" marker-end="url(#tip)" d="M100,332 H339"/>
  <text class="mid" x="220" y="356">hold: kept, before the first run</text>
  <path class="flow" marker-end="url(#tip)" d="M100,364 H339"/>
  <rect class="note" x="12" y="378" width="176" height="44" rx="8"/>
  <text class="mid" x="100" y="396">a starts the run once it</text>
  <text class="mid" x="100" y="412">reads kept back from the log.</text>

  <text class="cap" x="20" y="448">Runner a is cut off</text>
  <path class="rule" d="M20,455 H660"/>
  <rect class="note" x="12" y="466" width="176" height="60" rx="8"/>
  <text class="mid" x="100" y="484">Its kept tasks go on.</text>
  <text class="mid" x="100" y="500">Its waiting tasks stay</text>
  <text class="mid" x="100" y="516">unstarted.</text>
  <path class="cut" d="M208,490 l12,12 m0,-12 l-12,12"/>
  <rect class="note" x="240" y="466" width="200" height="44" rx="8"/>
  <text class="mid" x="340" y="484">The lease of a ends 30 minutes</text>
  <text class="mid" x="340" y="500">after its last alive message.</text>
  <text class="mid" x="460" y="548">claims a's waiting tasks</text>
  <path class="flow" marker-end="url(#tip)" d="M580,556 H341"/>
  <rect class="note" x="492" y="570" width="176" height="44" rx="8"/>
  <text class="mid" x="580" y="588">b takes them over and runs</text>
  <text class="mid" x="580" y="604">them. Kept tasks stay with a.</text>

  <text class="cap" x="20" y="640">Runner a is back</text>
  <path class="rule" d="M20,647 H660"/>
  <text class="mid" x="220" y="670">reads the log before any run</text>
  <path class="flow" marker-end="url(#tip)" d="M340,678 H101"/>
  <rect class="note" x="12" y="692" width="176" height="44" rx="8"/>
  <text class="mid" x="100" y="710">a drops each task that</text>
  <text class="mid" x="100" y="726">moved to runner b.</text>
</svg>
