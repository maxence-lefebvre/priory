<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="680" height="590" role="img" aria-labelledby="title desc">
  <title id="title">The life of an ask</title>
  <desc id="desc">A sequence between the agent, the daemon and a person, from top to bottom. The agent calls ask with a question, options and a recommendation. Its turn ends and the task sleeps, with no process. The desk lists the ask in the web view, Herdr and priory desk. The person can snooze the ask, say for an hour: it leaves the desk and comes back when the time is up. The person answers with an option or a text, at the ask's revision. The first answer stands and waits as the task's next prompt. The next run resumes the agent's session and types the answer as a prompt, and the agent carries on with it.</desc>
  <style>
    svg { --surface: #FFFFFF; --raised: #F1F1F1; --line: #E7E7E7; --edge: #878787; --text: #161616; --text-2: #4A4A4A; --text-3: #6E6E6E; --action: #161616; --action-soft: #F1F1F1; --wait: #A84D06; --danger: #C0262D; }
    @media (prefers-color-scheme: dark) {
      svg { --surface: #141414; --raised: #1D1D1D; --line: #262626; --edge: #6B6B6B; --text: #EDEDED; --text-2: #B5B5B5; --text-3: #8A8A8A; --action: #EDEDED; --action-soft: #1D1D1D; --wait: #F0A04B; --danger: #F2777A; }
    }
    text { font: 12px "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text-2); }
    .t { font-weight: 600; font-size: 14px; fill: var(--text); }
    .cap { font-weight: 600; fill: var(--text-3); }
    .mid { text-anchor: middle; }
    .bg { fill: var(--surface); stroke: var(--line); }
    .box { fill: var(--surface); stroke: var(--edge); stroke-width: 1.5; }
    .person { fill: var(--surface); stroke: var(--wait); stroke-width: 1.5; }
    .note { fill: var(--raised); }
    .zone { fill: none; stroke: var(--edge); stroke-dasharray: 4 4; }
    .life { stroke: var(--edge); stroke-dasharray: 2 5; }
    .flow { fill: none; stroke: var(--text-2); stroke-width: 1.5; }
    .human { fill: none; stroke: var(--text); stroke-width: 3.5; }
    #tip { fill: var(--text-2); } #tip-human { fill: var(--text); }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="tip-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="679" height="589" rx="12"/>

  <path class="life" d="M100,64 V574 M340,64 V574 M580,64 V574"/>
  <rect class="box" x="12" y="20" width="176" height="44" rx="8"/>
  <text class="t mid" x="100" y="47">The agent</text>
  <rect class="box" x="252" y="20" width="176" height="44" rx="8"/>
  <text class="t mid" x="340" y="47">The daemon</text>
  <rect class="person" x="492" y="20" width="176" height="44" rx="8"/>
  <text class="t mid" x="580" y="47">A person</text>

  <text class="mid" x="220" y="92">calls ask: a question,</text>
  <text class="mid" x="220" y="107">options, a recommendation</text>
  <path class="flow" marker-end="url(#tip)" d="M100,116 H339"/>
  <rect class="note" x="12" y="130" width="176" height="44" rx="8"/>
  <text class="mid" x="100" y="148">The turn ends. The task</text>
  <text class="mid" x="100" y="164">sleeps, with no process.</text>

  <text class="mid" x="460" y="200">the desk lists the ask: in the web</text>
  <text class="mid" x="460" y="215">view, Herdr and priory desk</text>
  <path class="flow" marker-end="url(#tip)" d="M340,224 H579"/>

  <rect class="zone" x="250" y="244" width="418" height="102" rx="8"/>
  <text class="cap" x="262" y="264">Or snooze it first</text>
  <text class="mid" x="460" y="282">snoozes the ask, say for an hour</text>
  <path class="flow" marker-end="url(#tip)" d="M580,290 H341"/>
  <text class="mid" x="460" y="320">back on the desk when the time is up</text>
  <path class="flow" marker-end="url(#tip)" d="M340,328 H579"/>

  <text class="mid" x="460" y="376">answers with an option or a text,</text>
  <text class="mid" x="460" y="391">at the ask's revision</text>
  <path class="human" marker-end="url(#tip-human)" d="M580,400 H342"/>
  <rect class="note" x="252" y="414" width="176" height="44" rx="8"/>
  <text class="mid" x="340" y="432">The first answer stands and</text>
  <text class="mid" x="340" y="448">waits as the next prompt.</text>

  <text class="mid" x="220" y="484">its next run resumes the session</text>
  <text class="mid" x="220" y="499">and types the answer as a prompt</text>
  <path class="flow" marker-end="url(#tip)" d="M340,508 H101"/>
  <rect class="note" x="12" y="522" width="176" height="44" rx="8"/>
  <text class="mid" x="100" y="540">The agent carries on</text>
  <text class="mid" x="100" y="556">with the answer.</text>
</svg>
