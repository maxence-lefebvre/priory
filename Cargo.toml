[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/maxence-lefebvre/priory"

[workspace.dependencies]
herdr-bus = { git = "https://github.com/flupke/herdr-bus", version = "0.1.0" }
httparse = "1.10.1"
jiff = "0.2.46"
schemars = "1.2.3"
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1"
toml = "1.2.1"
uuid = { version = "1", features = ["v4", "v5"] }
priory-factory = { path = "crates/priory-factory" }
priory-intake = { path = "crates/priory-intake" }
priory-runtime = { path = "crates/priory-runtime" }
priory-core = { path = "crates/priory-core" }
