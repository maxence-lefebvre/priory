[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.3.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/maxence-lefebvre/priory"

[workspace.dependencies]
aes-gcm = "0.11.1"
base64ct = { version = "1.8.3", features = ["alloc"] }
herdr-bus = { git = "https://github.com/flupke/herdr-bus", version = "0.1.0" }
hkdf = "0.13.0"
hmac = "0.13.0"
httparse = "1.10.1"
jiff = "0.2.46"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
schemars = "1.2.3"
regex = "1.13.2"
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "v5"] }
priory-factory = { path = "crates/priory-factory" }
priory-intake = { path = "crates/priory-intake" }
priory-runtime = { path = "crates/priory-runtime" }
priory-core = { path = "crates/priory-core" }
