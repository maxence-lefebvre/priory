#:schema https://raw.githubusercontent.com/maxence-lefebvre/priory/main/docs/schemas/config/trigger.json
source = "sentry"
on = "issue.created"
filter = { project = "my-project", level = "error" }   # the project's slug
repo = "owner/repo"
workflow = "investigate"
key = "issue.id"                                     # the task key is sentry:<issue id>
