#:schema https://raw.githubusercontent.com/maxence-lefebvre/priory/main/docs/schemas/config/trigger.json
source = "figma"
on = "file.comment_created"
filter = { file = "my-file-key" }   # the Figma file where designers review the built app
repo = "owner/repo"
workflow = "investigate"
key = "file.key"                    # the task key is figma:<file key>
