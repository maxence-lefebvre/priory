#:schema https://raw.githubusercontent.com/maxence-lefebvre/priory/main/docs/schemas/config/factory.json
name = "bug-investigation"
writing = "WRITING.md"
gate = "make test"   # your project's tests, which `priory gate` runs

[serve]
listen = "127.0.0.1:7340"   # reach it from Sentry, Honeycomb, Intercom, EventBridge and Figma through a tunnel, such as tailscale funnel 7340
token_env = "PRIORY_TOKEN"

[webhooks.sentry]
secret_env = "SENTRY_CLIENT_SECRET"   # the variable holding the integration's Client Secret

[webhooks.cloudwatch]
secret_env = "CLOUDWATCH_WEBHOOK_SECRET"   # the variable holding the EventBridge connection's API key value

[webhooks.honeycomb]
secret_env = "HONEYCOMB_WEBHOOK_SECRET"   # the variable holding the recipient's Shared Secret

[webhooks.figma]
secret_env = "FIGMA_WEBHOOK_PASSCODE"   # the variable holding the passcode the webhook was created with

[webhooks.intercom]
secret_env = "INTERCOM_CLIENT_SECRET"   # the variable holding the app's client secret
workspace = "my-workspace"              # your workspace id, from your Intercom URL

# The investigator may ask the sentry agent one question at a time, which reads Sentry for it.
[consult]
deadline = "15m"
cap = 0.50
per_task = 5

[consult.allow]
investigator = ["sentry"]

[mcp.sentry]
read_only = "The Sentry token has the org:read, project:read and event:read scopes only."
