#:schema https://raw.githubusercontent.com/maxence-lefebvre/priory/main/docs/schemas/config/workflow.json
start = "groom"
band = "today"

[[steps]]
id = "groom"
decides = "model"
agent = "implementer"
prompt = "Read the ticket and grade it red, yellow or green with a one-line reason. Write the brief, and for red or yellow your plan, in your result and in .priory/brief.md. Send the result's brief and verification fields too."
effect = "reversible"
next = { red = "approve-plan", yellow = "implement", green = "implement-green" }

[[steps]]
id = "approve-plan"
decides = "human"
effect = "none"
options = ["approved", "rejected"]
next = { approved = "implement", rejected = "stop" }

[[steps]]
id = "implement"
decides = "model"
agent = "implementer"
prompt = "Implement the brief and its plan, or fix each finding in .priory/review.md when it exists. Run the tests, and commit."
effect = "reversible"
next = { passed = "review", failed = "stop" }

# Another agent on another harness, so the review is independent of the implementer's conversation.
[[steps]]
id = "review"
decides = "model"
agent = "reviewer"
prompt = "Review the committed change against .priory/brief.md. Write each finding to .priory/review.md and end with fix, or end with clean."
effect = "reversible"
next = { clean = "risk", fix = "implement" }

# A fresh agent grades the finished change, so the person sees its risk before the diff.
[[steps]]
id = "risk"
decides = "model"
agent = "risk"
prompt = "Grade the merge risk of the committed change low, medium or high."
effect = "reversible"
next = { low = "describe", medium = "describe", high = "describe" }

# open-pr takes the latest result as the pull request's title and body, not a verdict.
[[steps]]
id = "describe"
decides = "model"
agent = "implementer"
prompt = "Describe the pull request in your result: its title on the first line, then what changed, how you tested it, and the merge risk in .priory/risk.md."
effect = "reversible"
next = { described = "open-pr" }

[[steps]]
id = "implement-green"
decides = "model"
agent = "implementer"
prompt = "Implement the brief, run the tests, and commit."
effect = "reversible"
next = { passed = "risk", failed = "stop" }

# A person reviews every pull request before it merges, and nothing here merges.
[[steps]]
id = "open-pr"
decides = "code"
action = "open-pr"
effect = "irreversible"
autonomous = "it only opens a pull request, which a person reviews before anyone merges it"
next = { opened = "done", failed = "stop" }
