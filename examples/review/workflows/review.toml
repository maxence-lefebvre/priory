#:schema https://raw.githubusercontent.com/maxence-lefebvre/priory/main/docs/schemas/config/workflow.json
start = "risk"

# Another agent grades the pull request first. Its verdict shows on the submit ask, and the
# review's result, which names the pending review, stays the latest.
[[steps]]
id = "risk"
decides = "model"
agent = "risk"
prompt = "Grade this pull request's merge risk low, medium or high."
effect = "read"
next = { low = "review", medium = "review", high = "review" }

# A pending review is visible only to its author and can be deleted, so writing one is reversible.
[[steps]]
id = "review"
decides = "model"
agent = "reviewer"
prompt = "Review this pull request and write your findings as one pending GitHub review, created without an event. Never submit it. Put the review's URL in your result."
effect = "reversible"
next = { written = "submit", "nothing-to-review" = "done" }

[[steps]]
id = "submit"
decides = "human"
effect = "none"
options = ["submitted", "discarded"]
next = { submitted = "done", discarded = "stop" }
