name: Release

# A pushed `v*` tag builds and publishes a GitHub Release. A manual run, or a pull request that
# changes the release files, builds and checks the same assets as CI artifacts and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/release.yml, install.sh]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse a tag that differs from the workspace version
        run: |
          test "$(grep -c '^version = ' Cargo.toml)" -eq 1
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          echo "Workspace version: $version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME differs from the workspace version $version"
            exit 1
          fi
      - name: Refuse a tag on a commit that is not on main
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and the target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: Install the musl C toolchain for the bundled SQLite and ring
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_$(echo "$TARGET" | tr - _)=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p priory --target "$TARGET"
      - name: Stage the binary and its checksum
        run: |
          mkdir dist
          cp "target/$TARGET/release/priory" "dist/priory-$TARGET"
          cd dist
          shasum -a 256 "priory-$TARGET" > "priory-$TARGET.sha256"
          cat "priory-$TARGET.sha256"
      - name: Check that the Linux binary is static and checks the examples in a clean container
        if: runner.os == 'Linux'
        run: |
          file "dist/priory-$TARGET"
          linked="$(ldd "dist/priory-$TARGET" 2>&1 || true)"
          echo "ldd: $linked"
          echo "$linked" | grep -qE 'statically linked|not a dynamic executable'
          docker run --rm --network none \
            -v "$PWD/dist/priory-$TARGET:/usr/local/bin/priory:ro" \
            -v "$PWD/examples:/examples:ro" \
            alpine:3.22 sh -euc 'priory --version; for dir in /examples/*/; do priory check "$dir"; echo "checked $dir"; done'
      - name: Install through install.sh from the staged files
        run: |
          PRIORY_RELEASE_URL="file://$PWD/dist" sh install.sh --prefix "$RUNNER_TEMP/prefix"
          "$RUNNER_TEMP/prefix/bin/priory" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: priory-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  adapters:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack the Herdr adapter, the GitHub extension and the Claude Code plugin
        run: |
          mkdir dist
          tar -czf dist/priory-herdr.tar.gz -C adapters --exclude=herdr/test herdr
          tar -czf dist/priory-claude-plugin.tar.gz -C adapters --exclude=claude-plugin/test claude-plugin
          (cd adapters/github && zip -qr ../../dist/priory-github-extension.zip . -x 'test/*' package.json)
          cd dist
          for asset in priory-herdr.tar.gz priory-github-extension.zip priory-claude-plugin.tar.gz; do
            sha256sum "$asset" > "$asset.sha256"
          done
          cat ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: priory-adapters
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, adapters]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Attest the build provenance of each asset, for gh attestation verify
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # A version with a pre-release part, such as 0.2.0-rc1, must not become "latest".
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Priory $GITHUB_REF_NAME" --generate-notes $prerelease
