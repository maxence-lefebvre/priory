name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Fail on leftover merge conflict markers
        run: |
          status=0
          git grep -nE '^(<{7}|>{7}|={7}$)' || status=$?
          test "$status" -eq 1
      - name: Test the Herdr adapter and the web view
        run: node --version && node --test adapters/herdr/test/*.test.js crates/priory-core/web/*.test.js
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint the in-process embedding model
        run: cargo clippy -p priory --features model -- -D warnings
      - name: Install tmux for the runtime tests
        run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
      - run: cargo test --workspace
