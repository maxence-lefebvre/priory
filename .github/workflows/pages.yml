name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MDBOOK_VERSION: v0.5.4
  MDBOOK_SHA256: 5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89
  LYCHEE_VERSION: lychee-v0.24.2
  LYCHEE_SHA256: 73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mdBook and lychee
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfLo mdbook.tar.gz "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfLo lychee.tar.gz "https://github.com/lycheeverse/lychee/releases/download/$LYCHEE_VERSION/lychee-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  mdbook.tar.gz\n%s  lychee.tar.gz\n' "$MDBOOK_SHA256" "$LYCHEE_SHA256" | sha256sum -c -
          tar -xzf mdbook.tar.gz -C bin
          mkdir lychee && tar -xzf lychee.tar.gz -C lychee
          find lychee -type f -name lychee -exec mv {} bin/ \;
          bin/mdbook --version && bin/lychee --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Test the staging script
        run: python3 -m unittest discover -s site -p 'test_*.py'
      - name: Build the site
        run: |
          python3 site/build.py
          mdbook build site
      - name: Upload the site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/build/html
          retention-days: 7
      - name: Check every internal link
        run: lychee --offline --include-fragments --no-progress --root-dir "$PWD/site/build/html" 'site/build/html/**/*.html'
      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
