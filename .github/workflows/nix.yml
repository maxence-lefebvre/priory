name: Nix

on:
  pull_request:
    paths: [flake.nix, flake.lock, Cargo.lock, .github/workflows/nix.yml]

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - run: nix flake check --all-systems
      - run: nix run . -- --version
