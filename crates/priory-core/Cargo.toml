[package]
name = "priory-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm.workspace = true
base64ct.workspace = true
hkdf.workspace = true
p256.workspace = true
sha2.workspace = true
herdr-bus.workspace = true
jiff = { workspace = true, features = ["serde"] }
priory-factory.workspace = true
priory-intake.workspace = true
priory-runtime.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }

[features]
# The in-process embedding model: candle and tokenizers, pure Rust, weights fetched at first use.
model = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
