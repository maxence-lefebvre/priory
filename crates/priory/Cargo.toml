[package]
name = "priory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/priory-{ target }"
pkg-fmt = "bin"

[dependencies]
jiff.workspace = true
priory-core.workspace = true
priory-factory.workspace = true
priory-intake.workspace = true
priory-runtime.workspace = true
serde_json.workspace = true

[features]
model = ["priory-core/model"]
# The Postgres event log adapter.
postgres = ["priory-intake/postgres"]

[dev-dependencies]
aes-gcm.workspace = true
base64ct.workspace = true
hkdf.workspace = true
p256.workspace = true
proptest.workspace = true
herdr-bus.workspace = true
hmac.workspace = true
jsonschema = { version = "=0.60.2", default-features = false }
rusqlite.workspace = true
schemars.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
toml.workspace = true
tungstenite.workspace = true
uuid.workspace = true
